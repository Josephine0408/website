<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>花若芬芳 蝴蝶自來</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", serif;
      background: #fff0f5;
      color: #4b0082;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 80px;
      margin-bottom: 10px;
    }

    .date {
      font-size: 36px;
      margin-bottom: 40px;
    }

    .search-box {
      margin-bottom: 50px;
    }

    input[type="text"] {
      width: 60%;
      padding: 15px;
      font-size: 24px;
      border-radius: 15px;
      border: 2px solid #d8bfd8;
    }

    .section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      font-size: 36px;
    }

    .section a {
      display: block;
      padding: 20px;
      background: #ffe4e1;
      border-radius: 20px;
      text-decoration: none;
      color: #800080;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, background 0.3s;
    }

    .section a:hover {
      transform: scale(1.05);
      background: #ffccff;
    }
  </style>
</head>
<body>
  <h1>花若芬芳 蝴蝶自來</h1>
  <div class="date" id="current-date"></div>

  <div class="search-box">
    <input type="text" placeholder="請輸入搜尋內容...">
  </div>

  <div class="section">
    <a href="https://openai.com/chatgpt/overview/" target="_blank">chatGPT</a>
    <a href="https://create.kahoot.it/my-library/kahoots/7dd98652-8c62-4b53-9ef9-678d7824866e" target="_blank">Kahoot</a>
    <a href="https://hlcedu.padlet.org/dashboard?mobile_page=Collection&filter=all" target="_blank">Padlet</a>
    <a href="https://wordwall.net/tc/myactivities" target="_blank">Wordwall</a>
    <a href="https://quizlet.com/latest" target="_blank">Quizlet</a>
    <a href="https://quizizz.com/admin" target="_blank">Quizizz</a>
    <a href="https://gemini.google.com/app?hl=zh-TW" target="_blank">Germini</a>
    <a href="https://www.google.com.tw/" target="_blank">Google</a>
    <a href="https://gitmind.com/app/docs?lang=tw" target="_blank">GitMind</a>
    <a href="https://www.canva.com/" target="_blank">CANAVA</a>
    <a href="https://www.gimkit.com/me" target="_blank">Gimkit</a>
    <a href="https://gamma.app/#inspiration" target="_blank">Gamma</a>
    <a href="https://aieducator.tools/?filter=MadeforEducation-%3A%25F0%259F%258E%2593%2520Made%2520for%2520Education" target="_blank">教育AI工具</a>
    <a href="https://notebooklm.google.com/" target="_blank">文字變語音</a>
    <a href="https://www.evernote.com/client/web" target="_blank">其他</a>
  </div>

  <script>
    const dateElement = document.getElementById('current-date');
    const today = new Date();
    const formattedDate = today.toLocaleDateString('zh-TW', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      weekday: 'long'
    });
    dateElement.textContent = formattedDate;
  </script>
</body>
</html>
